version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - bodyclose
    - gocritic
    - contextcheck
    - prealloc
    - unconvert
    - gocyclo
    - errorlint
    - whitespace
    - unparam
    - nakedret

linters-settings:
  gocyclo:
    min-complexity: 30

  goimports:
    local-prefixes: edo

  govet:
    enable-all: true
    disable:
      - fieldalignment